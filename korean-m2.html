  <style>

:root {
    --ink:#34303a;
    --paper:#fffaf6;
    --pink:#f5b9c5;
    --shadow:0 18px 45px #7e5e6530;
}
* {
    box-sizing:border-box;
}
body {
    margin:0;
    color:var(--ink);
    font-family:"Noto Sans KR","Noto Sans SC",sans-serif;
    background: radial-gradient(circle at 10% 10%,#fbe1e8 0 8%,transparent 24%), radial-gradient(circle at 90% 15%,#e3f4ee 0 8%,transparent 25%), linear-gradient(135deg,#fff9f2,#f7eee8);
    min-height:100vh;
}
.app {
    max-width:1120px;
    margin:auto;
    padding: 55px 18px 60px;
}
header {
    display:flex;
    gap:20px;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
}
h1 {
    font-family:Gaegu,cursive;
    font-size:clamp(38px,6vw,66px);
    line-height:.9;
    margin:0;
}
.sub {
    opacity:.68;
    margin-top:8px;
}
.controls {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
button,select {
    border:0;
    border-radius:999px;
    background:#fff;
    padding:11px 16px;
    box-shadow:0 5px 18px #72586620;
    font:inherit;
    color:inherit;
    cursor:pointer;
}
button:hover {
    transform:translateY(-1px);
}
button.primary {
    background:#ef9fb1;
    color:#fff;
    font-weight:700;
}
.stats {
    margin:24px 0 12px;
    display:flex;
    justify-content:space-between;
    gap:14px;
    font-size:14px;
}
.bar {
    height:9px;
    background:#ffffffa8;
    border-radius:99px;
    overflow:hidden;
}
.fill {
    height:100%;
    width:0;
    background:linear-gradient(90deg,#f2a8b9,#d9a6e8);
    transition:.3s;
}
.stage {
    perspective:1200px;
    margin:28px auto 18px;
    max-width:650px;
}
.card {
    height:min(610px,70vh);
    min-height:500px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
}
.card.flip {
    transform:rotateY(180deg);
}
.face {
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:32px;
    background:var(--paper);
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid #fff;
}
.back {
    transform:rotateY(180deg);
}
.ribbon {
    height:72px;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:700;
}
.ribbon small {
    background:#ffffff9c;
    border-radius:99px;
    padding:6px 10px;
}
.frontBody {
    height:calc(100% - 72px);
    display:grid;
    place-items:center;
    text-align:center;
    padding:34px;
}
.ko {
    font-size:clamp(54px,10vw,92px);
    font-weight:800;
    letter-spacing:-3px;
}
.zh {
    font-size:25px;
    margin-top:20px;
}
.en {
    font-size:18px;
    opacity:.65;
    margin-top:5px;
}
.scene {
    margin-top:36px;
    width:min(380px,90%);
    height:150px;
    border-radius:25px;
    background:linear-gradient(135deg,#ffe0e7,#f4d9ef);
    position:relative;
    overflow:hidden;
    display:grid;
    place-items:center;
}
.cat {
    font-size:75px;
}
.bubble {
    position:absolute;
    right:16px;
    top:15px;
    background:#fff;
    padding:9px 13px;
    border-radius:16px;
    font-family:Gaegu,cursive;
    font-size:22px;
    max-width:58%;
}
.backBody {
    padding:34px 42px;
}
.back .ko {
    font-size:54px;
    text-align:center;
}
.meaning {
    margin:28px 0;
    background:#fde4e9;
    padding:18px 20px;
    border-radius:20px;
}
.meaning b {
    font-size:22px;
}
.example {
    border-top:2px dashed #dcced0;
    padding-top:24px;
}
.example .exko {
    font-size:27px;
    font-weight:700;
}
.example p {
    margin:7px 0;
}
.tip {
    margin-top:26px;
    padding:14px 17px;
    border-radius:16px;
    background:#fff1ca;
    font-size:14px;
}
.nav {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
}
.nav button {
    min-width:120px;
}
.deck {
    margin-top:32px;
}
.deck h2 {
    font-family:Gaegu,cursive;
    font-size:34px;
    margin-bottom:12px;
}
.chips {
    display:flex;
    gap:8px;
    overflow:auto;
    padding:3px 2px 12px;
}
.chip {
    white-space:nowrap;
}
.chip.active {
    outline:3px solid #ffffff;
    box-shadow:0 0 0 3px #e9a2b2;
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:10px;
}
.mini {
    background:#fffaf6;
    border-radius:17px;
    padding:13px;
    min-height:105px;
    box-shadow:0 5px 15px #806a7020;
    cursor:pointer;
    border-top:7px solid var(--c);
}
.mini b {
    display:block;
    font-size:22px;
}
.mini span {
    font-size:12px;
    opacity:.66;
}
footer {
    text-align:center;
    margin-top:34px;
    opacity:.55;
    font-size:12px;
}
.back-button {
    position: fixed;
    top: 18px;
    left: 18px;
    padding: 9px 14px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.8);
    color: #555;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
}
.back-button:hover {
    transform: translateY(-2px);
}
@media(max-width:600px) {
    .card {
        min-height:480px;
        height:65vh;
    }
    .backBody {
        padding:28px 24px;
    }
    .ribbon {
        height:62px;
    }
    .frontBody {

    }
    .scene {
        height:130px;
    }
    .ko {
        font-size:56px;
    }
    .nav button {
        min-width:0;
        flex:1;
    }
}

// ============================================================
// LESSON COLORS & TIPS
// ============================================================
const colors={L1:"#9fd7f4",L2:"#bcebd7",L3:"#f4c4d0",L4:"#f8dfa0",L5:"#efb6d8",L6:"#ffc58e",L7:"#d9b6ee",L8:"#b7c9ff"};
const tips={L1:"Reaction words: recognize the whole shape instead of sounding out every letter.",L2:"알아 / 몰라 are extremely common spoken chunks.",L3:"Korean question words stay in the normal sentence position.",L4:"안 = ‘not’. 됐어 changes meaning with context and tone.",L5:"-지 마 = ‘don’t…’. Treat it as a high-value listening pattern.",L6:"Train these as whole visual chunks: 가 · 와 · 먹어 · 봐 · 자.",L7:"좋아 = good; 좋아해 = like. 싫어 / 싫어해 overlap more in everyday meaning.",L8:"Review: let context fill in subjects and objects that Korean leaves out."};
// ============================================================
// APP LOGIC
// Normally you do not need to edit below this point.
// ============================================================
let pool = [...cards];
let i = 0;
let filter = "ALL";
const $ = (id) => document.getElementById(id);
function options(){ $("lesson").innerHTML='<option value="ALL">All lessons</option>'+[...new Set(cards.map(x=>x.lesson))].map(x=>`<option>${x}</option>`).join("");}
function render(){
 let c=pool[i]; if(!c)return;
 $("card").classList.remove("flip"); ["rib1","rib2"].forEach(x=>$(x).style.background=colors[c.lesson]);
 $("cat1").textContent=c.category; $("lesson1").textContent=$("lesson2").textContent=c.lesson;
 $("ko1").textContent=$("ko2").textContent=c.ko; $("zh1").textContent=$("zh2").textContent=c.zh; $("en1").textContent=$("en2").textContent=c.en;
 $("bubble").textContent=c.ko; $("exko").textContent=c.exko; $("exzh").textContent=c.exzh; $("exen").textContent=c.exen; $("tip").textContent=tips[c.lesson];
 $("count").textContent=`${i+1} / ${pool.length}`; $("fill").style.width=((i+1)/pool.length*100)+"%";
 drawGrid();
}
function drawGrid(){
 $("grid").innerHTML=pool.map((c,n)=>`<div class="mini" style="--c:${colors[c.lesson]}" data-n="${n}"><b>${c.ko}</b><span>${c.zh}</span></div>`).join("");
 document.querySelectorAll(".mini").forEach(el=>el.onclick=()=>{i=+el.dataset.n;render();scrollTo({top:0,behavior:"smooth"})});
}
function drawChips(){
 $("chips").innerHTML=["ALL","L1","L2","L3","L4","L5","L6","L7","L8"].map(x=>`<button class="chip ${filter===x?"active":""}" data-f="${x}">${x==="ALL"?"All":x}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
}
function setFilter(f){filter=f; pool=f==="ALL"?[...cards]:cards.filter(x=>x.lesson===f);i=0;$("lesson").value=f;drawChips();render()}
$("card").onclick=()=>$("card").classList.toggle("flip"); $("flip").onclick=()=>$("card").classList.toggle("flip");
$("next").onclick=()=>{i=(i+1)%pool.length;render()}; $("prev").onclick=()=>{i=(i-1+pool.length)%pool.length;render()};
$("shuffle").onclick=()=>{pool.sort(()=>Math.random()-.5);i=0;render()}; $("reset").onclick=()=>setFilter("ALL");
$("lesson").onchange=e=>setFilter(e.target.value);
document.onkeydown=e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key===" "){e.preventDefault();$("flip").click()}};
options();drawChips();render();
</script>
