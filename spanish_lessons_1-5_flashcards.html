<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanish Lessons 1–5 Flashcards</title>
<style>
*{box-sizing:border-box}
:root{
  --bg1:#fff7ed;
  --bg2:#eef6ff;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#d8dee8;
  --shadow:0 18px 50px rgba(31,41,55,.14);
}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  padding:24px;
}
.app{width:min(860px,100%);margin:0 auto}
.header{text-align:center;margin-bottom:20px}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem)}
.subtitle{margin:0;color:var(--muted)}
.stats{margin-top:8px;font-size:.95rem;color:var(--muted)}
.controls{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:18px 0;
}
select,button{
  font:inherit;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  background:#fff;
  color:var(--text);
}
button{cursor:pointer}
button:hover,select:hover{border-color:#8b98a9}
.card{
  min-height:390px;
  background:var(--card);
  border-radius:26px;
  padding:34px 28px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  user-select:none;
  position:relative;
}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.badge{
  padding:6px 10px;
  border-radius:999px;
  background:#f3f4f6;
  color:#4b5563;
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.emoji{font-size:4.2rem;margin-bottom:16px}
.front{font-size:clamp(2rem,6vw,3.5rem);font-weight:700;line-height:1.2}
.back{display:none;width:100%}
.card.flipped .front{display:none}
.card.flipped .back{display:block}
.english{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;margin-bottom:20px}
.example-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin-bottom:7px}
.example{font-size:clamp(1.15rem,3vw,1.5rem);color:#4b5563;line-height:1.5}
.hint{position:absolute;bottom:20px;color:#9ca3af;font-size:.9rem}
.bottom-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.progress{text-align:center;margin-top:14px;color:var(--muted)}
.empty{font-size:1.2rem;color:var(--muted)}

.back-button {
    position: fixed;
    top: 18px;
    left: 18px;

    padding: 9px 14px;

    border: none;
    border-radius: 12px;

    background: rgba(255, 255, 255, 0.8);
    color: #555;

    font-size: 14px;
    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
}

.back-button:hover {
    transform: translateY(-2px);
}
@media(max-width:680px){
  body{padding:14px}
  .controls{grid-template-columns:1fr}
  .bottom-bar{grid-template-columns:1fr}
  .card{min-height:360px;padding:28px 20px}
}
</style>
</head>
<body>
<main class="app">
  <button class="back-button" onclick="window.location.href='spanish.html'">
    ← Spanish Drawers
</button>
  <div class="header">
    <h1>Spanish Flashcards</h1>
    <p class="subtitle">A fuller deck for Lessons 1–5</p>
    <div class="stats" id="stats"></div>
  </div>

  <div class="controls">
    <select id="lessonFilter">
      <option value="all">All lessons</option>
      <option value="1">Lesson 1</option>
      <option value="2">Lesson 2</option>
      <option value="3">Lesson 3</option>
      <option value="4">Lesson 4</option>
      <option value="5">Lesson 5</option>
    </select>

    <select id="typeFilter">
      <option value="all">All card types</option>
      <option value="vocab">Vocabulary</option>
      <option value="expression">Expressions</option>
      <option value="question">Questions</option>
      <option value="pattern">Sentence patterns</option>
    </select>

    <button id="shuffleBtn">Shuffle cards</button>
  </div>

  <section class="card" id="card" tabindex="0" aria-label="Flashcard">
    <div class="badges">
      <div class="badge" id="lessonBadge"></div>
      <div class="badge" id="typeBadge"></div>
    </div>
    <div class="emoji" id="emoji"></div>
    <div class="front" id="front"></div>
    <div class="back">
      <div class="english" id="english"></div>
      <div class="example-label">Example</div>
      <div class="example" id="example"></div>
    </div>
    <div class="hint">Click the card or press Space to flip</div>
  </section>

  <div class="bottom-bar">
    <button id="prevBtn">← Previous</button>
    <button id="randomBtn">Random card</button>
    <button id="nextBtn">Next →</button>
  </div>

  <div class="progress" id="progress"></div>
</main>

"english":"to chat","emoji":"💬","example":"Se sientan y se ponen a charlar."},{"lesson":5,"type":"expression","spanish":"a la una y media","english":"at one thirty","emoji":"🕜","example":"A la una y media comienza el almuerzo."},{"lesson":5,"type":"vocab","spanish":"amigo / amiga","english":"friend","emoji":"👥","example":"La madre invita a los amigos de Yolanda a sentarse."},{"lesson":5,"type":"pattern","spanish":"invitar a alguien a + infinitivo","english":"to invite someone to do something","emoji":"✉️","example":"Invita a sus amigos a sentarse a la mesa."},{"lesson":5,"type":"expression","spanish":"sentarse a la mesa","english":"to sit down at the table","emoji":"🍽️","example":"Los amigos se sientan a la mesa."},{"lesson":5,"type":"vocab","spanish":"comenzar","english":"to begin / start","emoji":"▶️","example":"Comienza el almuerzo."},{"lesson":5,"type":"vocab","spanish":"plato","english":"dish / plate","emoji":"🍽️","example":"Hay muchos platos sabrosos."},{"lesson":5,"type":"vocab","spanish":"sabroso / sabrosa","english":"tasty / delicious","emoji":"😋","example":"Hay muchos platos sabrosos."},{"lesson":5,"type":"expression","spanish":"todo el mundo","english":"everyone / everybody","emoji":"🌍","example":"Todo el mundo levanta su copa."},{"lesson":5,"type":"vocab","spanish":"levantar","english":"to raise / lift","emoji":"⬆️","example":"Todo el mundo levanta su copa."},{"lesson":5,"type":"vocab","spanish":"copa","english":"glass / goblet","emoji":"🥂","example":"Todo el mundo levanta su copa para brindar."},{"lesson":5,"type":"vocab","spanish":"brindar","english":"to toast","emoji":"🥂","example":"Levantan sus copas para brindar."},{"lesson":5,"type":"pattern","spanish":"para + infinitivo","english":"in order to do something","emoji":"🎯","example":"Levantan sus copas para brindar."}];
let filtered = [...cards];
let index = 0;

const card = document.getElementById("card");
const lessonBadge = document.getElementById("lessonBadge");
const typeBadge = document.getElementById("typeBadge");
const emoji = document.getElementById("emoji");
const front = document.getElementById("front");
const english = document.getElementById("english");
const example = document.getElementById("example");
const progress = document.getElementById("progress");
const stats = document.getElementById("stats");
const lessonFilter = document.getElementById("lessonFilter");
const typeFilter = document.getElementById("typeFilter");

function prettyType(type) {
  return {
    vocab: "Vocabulary",
    expression: "Expression",
    question: "Question",
    pattern: "Pattern"
  }[type] || type;
}

function showCard() {
  card.classList.remove("flipped");

  if (!filtered.length) {
    lessonBadge.textContent = "";
    typeBadge.textContent = "";
    emoji.textContent = "🔎";
    front.innerHTML = '<div class="empty">No cards match these filters.</div>';
    english.textContent = "";
    example.textContent = "";
    progress.textContent = "0 / 0";
    stats.textContent = `${cards.length} total cards`;
    return;
  }

  const item = filtered[index];
  lessonBadge.textContent = `Lesson ${item.lesson}`;
  typeBadge.textContent = prettyType(item.type);
  emoji.textContent = item.emoji;
  front.textContent = item.spanish;
  english.textContent = item.english;
  example.textContent = item.example;
  progress.textContent = `${index + 1} / ${filtered.length}`;
  stats.textContent = `${cards.length} total cards • ${filtered.length} currently shown`;
}

function nextCard() {
  if (!filtered.length) return;
  index = (index + 1) % filtered.length;
  showCard();
}

function previousCard() {
  if (!filtered.length) return;
  index = (index - 1 + filtered.length) % filtered.length;
  showCard();
}

function randomCard() {
  if (!filtered.length) return;
  if (filtered.length === 1) {
    index = 0;
  } else {
    let nextIndex = index;
    while (nextIndex === index) {
      nextIndex = Math.floor(Math.random() * filtered.length);
    }
    index = nextIndex;
  }
  showCard();
}

function shuffleCards() {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  index = 0;
  showCard();
}

function applyFilters() {
  const lesson = lessonFilter.value;
  const type = typeFilter.value;

  filtered = cards.filter(item => {
    const lessonMatches = lesson === "all" || String(item.lesson) === lesson;
    const typeMatches = type === "all" || item.type === type;
    return lessonMatches && typeMatches;
  });

  index = 0;
  showCard();
}

function flipCard() {
  if (filtered.length) card.classList.toggle("flipped");
}

card.addEventListener("click", flipCard);
card.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    flipCard();
  }
});

document.getElementById("nextBtn").addEventListener("click", nextCard);
document.getElementById("prevBtn").addEventListener("click", previousCard);
document.getElementById("randomBtn").addEventListener("click", randomCard);
document.getElementById("shuffleBtn").addEventListener("click", shuffleCards);
lessonFilter.addEventListener("change", applyFilters);
typeFilter.addEventListener("change", applyFilters);

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextCard();
  if (event.key === "ArrowLeft") previousCard();
});

showCard();
</script>
