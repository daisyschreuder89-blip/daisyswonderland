<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Korean Hangul Flashcards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(135deg,
          #f8e8ff,
          #e4f2ff);
    }

    .flashcard-app {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 32px;
    }

    .card {
      min-height: 330px;
      padding: 40px 25px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background-color: white;

      border-radius: 28px;

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    #character {
      margin: 0 0 25px;

      font-size: 90px;
      font-weight: bold;
    }

    #word {
      margin: 0 0 18px;

      font-size: 32px;
      font-weight: bold;
    }

    #mandarin {
      margin: 0;

      font-size: 26px;
    }

    .counter {
      margin: 20px 0;

      font-size: 17px;
      color: #555;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 13px 24px;

      border: none;
      border-radius: 14px;

      font-size: 18px;
      cursor: pointer;

      background-color: white;

      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .error-message {
      color: darkred;
      font-size: 18px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 27px;
      }

      .card {
        min-height: 300px;
        padding: 30px 20px;
      }

      #character {
        font-size: 75px;
      }

      #word {
        font-size: 28px;
      }

      #mandarin {
        font-size: 23px;
      }

      button {
        padding: 12px 18px;
        font-size: 16px;
      }
    }
    .back-button {
    position: fixed;
    top: 18px;
    left: 18px;

    padding: 9px 14px;

    border: none;
    border-radius: 12px;

    background: rgba(255, 255, 255, 0.8);
    color: #555;

    font-size: 14px;
    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
}

.back-button:hover {
    transform: translateY(-2px);
}
  </style>
</head>

<body>

  <main class="flashcard-app">


    <div class="card" id="card">

      <p id="character">Loading...</p>

      <p id="word"></p>

      <p id="mandarin"></p>

    </div>

    <p class="counter" id="counter">
      Card 0 of 0
    </p>

    <div class="buttons">

      <button id="previous-button">
        ← Previous
      </button>

      <button id="next-button">
        Next →
      </button>
<button class="back-button" onclick="window.location.href='korean.html'">

</button>

    ];

    let currentCardIndex = 0;



    const characterElement =
      document.getElementById("character");

    const wordElement =
      document.getElementById("word");

    const mandarinElement =
      document.getElementById("mandarin");

    const counterElement =
      document.getElementById("counter");

    const previousButton =
      document.getElementById("previous-button");

    const nextButton =
      document.getElementById("next-button");





    function showCard() {

      const currentCard = cards[currentCardIndex];

      characterElement.textContent =
        currentCard.character;

      wordElement.textContent =
        currentCard.word;

      mandarinElement.textContent =
        currentCard.mandarin;

      counterElement.textContent =
        `Card ${currentCardIndex + 1} of ${cards.length}`;

    }


    function showNextCard() {

      currentCardIndex++;

      if (currentCardIndex >= cards.length) {
        currentCardIndex = 0;
      }

      showCard();

    }


    function showPreviousCard() {

      currentCardIndex--;

      if (currentCardIndex < 0) {
        currentCardIndex = cards.length - 1;
      }

      showCard();

    }


    nextButton.addEventListener(
      "click",
      showNextCard
    );


    previousButton.addEventListener(
      "click",
      showPreviousCard
    );


    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "ArrowRight") {
          showNextCard();
        }

        if (event.key === "ArrowLeft") {
          showPreviousCard();
        }

      }
    );

    showCard();
  </script>
