<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daisy Weather Index</title>
  <style>
    :root {
      --bg: #fff8fb;
      --panel: rgba(255, 255, 255, .78);
      --ink: #342f34;
      --soft: #846f7a;
      --line: rgba(121, 91, 108, .22);
      --accent: #d85d91;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(circle at 15% 5%, rgba(255, 255, 255, .95), transparent 32%),
        linear-gradient(150deg, #fff9fb 0%, #f9e9f0 100%);
      color: var(--ink);
      font-family: "DejaVu Sans", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.4vh, 24px);
    }

    main {
      width: min(94vw, 900px);
      min-height: min(92vh, 560px);
      height: auto;
      display: grid;
      grid-template-rows: auto 1px 1fr 1px auto 1px auto;
      gap: clamp(10px, 1.8vh, 16px);
      padding: clamp(18px, 3vh, 30px) clamp(22px, 4vw, 46px);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(116, 72, 94, .13);
      backdrop-filter: blur(8px);
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4.2vw, 42px);
      letter-spacing: .05em;
      font-weight: 800;
    }

    .place {
      margin-top: 5px;
      color: var(--soft);
      font-size: clamp(12px, 1.8vw, 17px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .line {
      background: var(--line);
      width: 60%;
    justify-self: center;
    }

    .weather {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: center;
      gap: clamp(10px, 1.8vh, 15px) clamp(14px, 3vw, 28px);
      width: min(100%, 690px);
      margin: auto;
    }

    .metric {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px 15px;
      background: rgba(255, 255, 255, .58);
      border-radius: 17px;
    }

    .metric-icon {
      width: 42px;
      text-align: center;
      font-size: clamp(25px, 3.8vw, 35px);
      flex: 0 0 auto;
    }

    .metric-text {
      min-width: 0;
      font-size: clamp(20px, 3vw, 29px);
      font-weight: 700;
      white-space: nowrap;
    }

    .metric-label {
      display: block;
      margin-top: 1px;
      color: var(--soft);
      font-size: clamp(10px, 1.5vw, 14px);
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .excuse-area {
      text-align: center;
      min-height: 108px;
      display: grid;
      align-content: center;
    }

    .excuse-title {
      color: var(--accent);
      font-size: clamp(13px, 1.9vw, 18px);
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .excuse {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(22px, 3.6vw, 36px);
      line-height: 1.18;
      font-weight: 750;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: var(--soft);
      font-size: clamp(10px, 1.4vw, 14px);
    }

    #status {
      text-align: right;
    }

    .error {
      color: #a83e61;
      font-size: clamp(17px, 2.6vw, 25px);
      text-align: center;
      grid-column: 1 / -1;
    }


    .home-button {
    position: absolute;
    top: 70px;
    right: 30px;
    z-index: 100;
}



    @media (max-height: 520px) {
      body {
        padding: 10px;
      }

      main {
        min-height: 96vh;
        height: auto;
        gap: 7px;
        padding: 12px 22px;
        border-radius: 20px;
      }

      .metric {
        min-height: 48px;
        padding: 7px 12px;
      }

      .excuse-area {
        min-height: 78px;
      }

      .place {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .weather {
        grid-template-columns: 1fr;
      }

      main {
        min-height: auto;
        height: auto;
      }

      .metric {
        min-height: 46px;
      }
    }
  </style>
</head>

<body>
 
  <main>
   
    <header>
      <h1 id="titleIcon">🌤️ DAISY WEATHER INDEX</h1>
      <div class="place">Nanaimo · Official Indoor Guidance</div>
    </header>

    <div class="line"></div>

    <section class="weather" id="weatherGrid" aria-live="polite">
      <div class="metric">
        <div class="metric-icon">🌡️</div>
        <div class="metric-text"><span id="temp">--°C</span><span class="metric-label">Temperature</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon">🩷</div>
        <div class="metric-text"><span id="feels">--°C</span><span class="metric-label">Feels like</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon">🌬️</div>
        <div class="metric-text"><span id="wind">-- km/h</span><span class="metric-label">Wind</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon">💧</div>
        <div class="metric-text"><span id="humidity">--%</span><span class="metric-label">Humidity</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon">☀️</div>
        <div class="metric-text"><span id="uv">--</span><span class="metric-label">UV index</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon" id="conditionIcon">🌤️</div>
        <div class="metric-text"><span id="condition">Loading</span><span class="metric-label">Conditions</span></div>
      </div>
    </section>

    <div class="line"></div>

    <section class="excuse-area">
      <div class="excuse-title">Today's Excuse of Not Going Out</div>
      <p class="excuse" id="excuse">Consulting the Department of Staying Home…</p>
    </section>

    <div class="line"></div>

    <footer>
      <span>Weather updates every 15 minutes</span>
      <span id="status">Connecting…</span>
    </footer>
  </main>

  <script>
    const LOCATION = {
      name: "Nanaimo",
      latitude: 49.1659,
      longitude: -123.9401,
      timezone: "America/Vancouver"
    };

    const excuses = {
      hot: [
        "Outside is basically soup.",
        "The sun chose violence today.",
        "Your air conditioner would miss you.",
        "Sweating counts as cardio.",
        "Nature has turned on the oven.",
        "Too hot for unnecessary movement."
      ],
      cold: [
        "It’s character-building weather. You have enough character.",
        "Your blanket has requested your presence.",
        "Penguins may enjoy this. You are not a penguin.",
        "The air hurts.",
        "Leaving requires additional clothing. Declined.",
        "Cold weather detected. Indoor operations continue."
      ],
      windy: [
        "It’s windy. Your hair filed a formal complaint.",
        "Wind speed exceeds hairstyle tolerance.",
        "Nature is yelling.",
        "Small cats may become airborne.",
        "Outside is aggressively ventilated.",
        "The wind would like to argue with you."
      ],
      rain: [
        "The sky is leaking again.",
        "Free shower available. Declined.",
        "Outside is damp and emotionally complicated.",
        "Your shoes deserve better.",
        "Going outside would involve equipment.",
        "Rain detected. Indoor credibility restored."
      ],
      humid: [
        "Everything is damp, including motivation.",
        "The atmosphere is touching you too much.",
        "Your hair has already given up.",
        "Humidity has removed personal boundaries.",
        "The air is wearing a wet sweater.",
        "Moisture levels are socially unacceptable."
      ],
      uv: [
        "The sun is being invasive.",
        "The sun would like to age you.",
        "Outdoor lighting is unnecessarily intense.",
        "Your skin has voted no.",
        "The sky has enabled maximum brightness.",
        "Shade is now premium seating."
      ],
      snow: [
        "Beautiful to look at. Not participating.",
        "Nature added glitter with poor traction.",
        "Snow detected. Admire through glass.",
        "Walking has become a balance exercise.",
        "The world looks magical. Stay inside.",
        "The ground has been inconveniently decorated."
      ],
      fog: [
        "The outdoors is currently in low-resolution mode.",
        "Visibility and enthusiasm are both reduced.",
        "The sky is doing something suspicious.",
        "Outside has misplaced the distance.",
        "The world has been softly censored.",
        "Too mysterious. Remain indoors."
      ],
      mild: [
       
    
        "Proceed only if something outside is worth it.",
        "Your couch has seniority.",
        "The indoors still has better snacks.",
        "Nothing outside is as comfortable as your blanket.",
        "The weather is fine. Your motivation isn't.",
        "Staying home remains a valid lifestyle choice.",
        "The house would miss you.",
        "Your cats voted against this outing.",
        "There is no emergency requiring pants.",
        "Home is already paid for. Might as well use it.",
        "Your tea hasn't finished steeping.",
        "Going outside would interrupt absolutely nothing.",
        "The internet is indoors.",
        "The trees can admire themselves today.",
        "You already made it home once today.",
        "Your slippers are doing an excellent job.",
        "Today has strong 'maybe tomorrow' energy.",
        "Your hobbies are inside.",
        "You have books that haven't read themselves.",
        "The weather passed inspection. You still don't have to.",
         "Technically acceptable. Emotionally optional.",
        "You could go out, but no one is forcing you.",
        "Survivable.",
        "Not terrible, which is inconvenient."
      ],
      perfect: [
              "Today's excuse has been rejected by management.",
        "You are running out of legal defenses.",
        "This appears to be an administrative error.",
        "Congratulations. Your laziness is now unsupported by science.",
        "Weather conditions have exceeded expectations. That's unfortunate.",
        "Today's weather is offensively pleasant.",
        "All outdoor quality assurance tests have passed.",
        "The weather has become inconveniently beautiful.",
        "The prosecution rests. Go outside.",
        "The jury finds the weather delightful.",
        "Case dismissed. Please proceed outdoors.",
        "Unfortunately, you have no excuse today.",
        "We searched extensively. No valid excuses found.",
       
        "Outdoor conditions are annoyingly reasonable.",
        "The weather has betrayed the indoor community.",
        "The Department of Staying Home has denied your request.",
        "Even we can't defend this one.",
        "Weather: 10/10. Motivation: under review.",
        "Your excuses have been temporarily suspended.",
        "The outdoors has filed an appeal and won.",
        "Fine. Go enjoy your precious sunshine.",
        "Today's forecast: zero legitimate complaints.",
        "This weather is suspiciously cooperative.",
        "Nature has presented an excellent argument.",
        "The weather has lawyered up.",
        "Your blanket has lost this case.",
        "No meteorological loopholes were found.",
        "Outside has met all safety standards.",
        "The sun came prepared with evidence."
  
      ]
    };

    const weatherCodeMap = {
      0: ["Clear", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Cloudy", "☁️"],
      45: ["Foggy", "🌫️"], 48: ["Icy fog", "🌫️"],
      51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
      56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
      61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "❄️"],
      80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Heavy showers", "⛈️"],
      85: ["Snow showers", "🌨️"], 86: ["Heavy snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"], 96: ["Storm with hail", "⛈️"], 99: ["Severe storm", "⛈️"]
    };

    function choose(list) {
      const dayKey = new Date().toLocaleDateString("en-CA", { timeZone: LOCATION.timezone });
      let seed = [...dayKey].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      seed += Math.floor(new Date().getHours() / 3);
      return list[seed % list.length];
    }

    function excuseCategory(w) {
      const rainyCodes = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
      const snowCodes = [71, 73, 75, 77, 85, 86];
      const fogCodes = [45, 48];

      if (snowCodes.includes(w.weather_code)) return "snow";
      if (rainyCodes.includes(w.weather_code) || w.precipitation > 0.2) return "rain";
      if (fogCodes.includes(w.weather_code)) return "fog";
      if (w.wind_speed_10m >= 20 || w.wind_gusts_10m >= 26) return "windy";
      if (w.apparent_temperature >= 27 || w.temperature_2m >= 27) return "hot";
      if (w.apparent_temperature <= 8 || w.temperature_2m <= 8) return "cold";
      if (w.relative_humidity_2m >= 82 && w.temperature_2m >= 18) return "humid";
      if (w.uv_index >= 7) return "uv";

      const perfect = w.temperature_2m >= 17 && w.temperature_2m <= 23 &&
        w.apparent_temperature >= 16 && w.apparent_temperature <= 24 &&
        w.wind_speed_10m < 16 && w.relative_humidity_2m < 75 &&
        w.uv_index < 6 && w.precipitation <= 0.1;
      return perfect ? "perfect" : "mild";
    }

    async function loadWeather() {
      const status = document.getElementById("status");
      try {
        status.textContent = "Updating…";
        const params = new URLSearchParams({
          latitude: LOCATION.latitude,
          longitude: LOCATION.longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,is_day",
          hourly: "uv_index",
          temperature_unit: "celsius",
          wind_speed_unit: "kmh",
          precipitation_unit: "mm",
          timezone: LOCATION.timezone,
          forecast_days: "1"
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error(`Weather service returned ${response.status}`);
        const data = await response.json();
        const w = { ...data.current };

        const currentHour = data.current.time.slice(0, 13) + ":00";
        const hourIndex = data.hourly.time.indexOf(currentHour);
        w.uv_index = hourIndex >= 0 ? data.hourly.uv_index[hourIndex] : 0;

        document.getElementById("temp").textContent = `${Math.round(w.temperature_2m)}°C`;
        document.getElementById("feels").textContent = `${Math.round(w.apparent_temperature)}°C`;
        document.getElementById("wind").textContent = `${Math.round(w.wind_gusts_10m)} km/h`;
        document.getElementById("humidity").textContent = `${Math.round(w.relative_humidity_2m)}%`;
        document.getElementById("uv").textContent = Number(w.uv_index).toFixed(1).replace(".0", "");

        const condition = weatherCodeMap[w.weather_code] || ["Weather happening", "🌤️"];
        document.getElementById("condition").textContent = condition[0];
        document.getElementById("conditionIcon").textContent = condition[1];
        document.getElementById("titleIcon").textContent = `${w.is_day ? condition[1] : "🌙"} DAISY WEATHER INDEX`;

        const category = excuseCategory(w);
        document.getElementById("excuse").textContent = choose(excuses[category]);

        const updated = new Date(data.current.time).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });
        status.textContent = `Updated ${updated}`;
      } catch (error) {
        console.error(error);
        document.getElementById("weatherGrid").innerHTML = `<div class="error">Weather unavailable.<br>The internet has provided an additional excuse.</div>`;
        document.getElementById("excuse").textContent = "Unable to verify outdoor conditions. Staying home is the only responsible choice.";
        status.textContent = "Update failed";
      }
    }

    loadWeather();
    setInterval(loadWeather, 15 * 60 * 1000);
  </script>
</body>

</html>
