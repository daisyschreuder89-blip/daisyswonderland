<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ambient Engine</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

/*=========================
BACKGROUND
=========================*/

#background{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    user-select:none;
    pointer-events:none;
object-fit: contain;
}

/*=========================
EFFECT LAYERS
=========================*/

.effectLayer{

    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

}

.effect{

    position:absolute;

    will-change:transform,opacity;

}



/*=========================
FLOWERS
=========================*/

.flower{
    position:absolute;
    top:-12vh;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;

    animation-name:flowerFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;

    will-change:transform,opacity;
}

.flowerInner{
    display:block;

    animation-name:flowerSpin;
    animation-timing-function:linear;
    animation-iteration-count:infinite;

    will-change:transform;
}

@keyframes flowerFall{

    0%{
        transform:translate3d(0,-15vh,0);
        opacity:0;
    }

    10%{
        opacity:.95;
    }

    50%{
        transform:
            translate3d(var(--drift),50vh,0);
    }

    90%{
        opacity:.9;
    }

    100%{
        transform:
            translate3d(var(--drift-end),115vh,0);
        opacity:0;
    }

}

@keyframes flowerSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(var(--rotation));
    }

}


/*=========================
SPARKLES
=========================*/

.sparkle{
    position:absolute;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 6px rgba(255,255,255,.95),
        0 0 14px rgba(255,220,255,.8),
        0 0 24px rgba(255,180,240,.5);

    animation-name:sparkleGlow;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;

    will-change:transform,opacity;
}

.sparkle::before,
.sparkle::after{
    content:"";

    position:absolute;
    top:50%;
    left:50%;

    background:rgba(255,255,255,.9);

    transform:translate(-50%,-50%);
}

.sparkle::before{
    width:1px;
    height:400%;
}

.sparkle::after{
    width:400%;
    height:1px;
}

@keyframes sparkleGlow{

    0%,
    100%{
        transform:scale(.35);
        opacity:.1;
    }

    50%{
        transform:scale(1.25);
        opacity:1;
    }

}


/*=========================
FLOATING DUST
=========================*/

.dust{
    position:absolute;

    border-radius:50%;

    background:rgba(255,245,210,.75);

    box-shadow:
        0 0 5px rgba(255,240,190,.7);

    animation-name:dustFloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;

    will-change:transform,opacity;
}

@keyframes dustFloat{

    0%{
        transform:
            translate3d(0,12vh,0)
            scale(.7);

        opacity:0;
    }

    20%{
        opacity:.55;
    }

    50%{
        transform:
            translate3d(var(--dust-x),-10vh,0)
            scale(1);

        opacity:.8;
    }

    80%{
        opacity:.5;
    }

    100%{
        transform:
            translate3d(var(--dust-x-end),-45vh,0)
            scale(.6);

        opacity:0;
    }

}


/*=========================
RAIN
=========================*/

.rainDrop{
    position:absolute;
    top:-25vh;
    width:2px;
    height:var(--rain-length);
    border-radius:999px;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(210,235,255,.82)
    );
    transform:rotate(var(--rain-angle));
    transform-origin:center;
    animation:rainFall linear infinite;
    filter:drop-shadow(0 0 2px rgba(180,220,255,.35));
}

@keyframes rainFall{
    from{
        transform:translate3d(0,-25vh,0) rotate(var(--rain-angle));
        opacity:0;
    }
    8%{ opacity:var(--rain-opacity); }
    to{
        transform:translate3d(var(--rain-drift),135vh,0) rotate(var(--rain-angle));
        opacity:0;
    }
}

/*=========================
SNOW
=========================*/

.snowFlake{
    position:absolute;
    top:-12vh;
    color:white;
    text-shadow:0 0 8px rgba(255,255,255,.75);
    animation:snowFall ease-in-out infinite;
    will-change:transform,opacity;
}

@keyframes snowFall{
    0%{
        transform:translate3d(0,-12vh,0) rotate(0deg);
        opacity:0;
    }
    12%{ opacity:var(--snow-opacity); }
    50%{
        transform:translate3d(var(--snow-mid),52vh,0) rotate(180deg);
        opacity:var(--snow-opacity);
    }
    100%{
        transform:translate3d(var(--snow-end),115vh,0) rotate(360deg);
        opacity:0;
    }
}

/*=========================
LEAVES
=========================*/

.leaf{
    position:absolute;
    top:-15vh;
    animation:leafFall ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.22));
    will-change:transform,opacity;
}

@keyframes leafFall{
    0%{
        transform:translate3d(0,-15vh,0) rotate(0deg) scale(.8);
        opacity:0;
    }
    10%{ opacity:var(--leaf-opacity); }
    35%{
        transform:translate3d(var(--leaf-x1),32vh,0) rotate(140deg) scale(1);
    }
    70%{
        transform:translate3d(var(--leaf-x2),78vh,0) rotate(330deg) scale(.9);
    }
    100%{
        transform:translate3d(var(--leaf-x3),118vh,0) rotate(540deg) scale(.75);
        opacity:0;
    }
}

/*=========================
BUTTERFLIES
=========================*/

.butterfly{
    position:absolute;
    left:-15vw;
    display:inline-block;
    line-height:1;
    animation:butterflyTravel ease-in-out infinite;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.24));
    will-change:transform,opacity;
}

.butterflyInner{
    display:inline-block;
    animation:butterflyFlutter .34s ease-in-out infinite alternate;
    transform-origin:center;
}

@keyframes butterflyTravel{
    0%{
        transform:translate3d(-15vw,var(--butterfly-y0),0) rotate(-8deg);
        opacity:0;
    }
    8%{ opacity:var(--butterfly-opacity); }
    30%{
        transform:translate3d(32vw,var(--butterfly-y1),0) rotate(7deg);
    }
    65%{
        transform:translate3d(70vw,var(--butterfly-y2),0) rotate(-5deg);
    }
    100%{
        transform:translate3d(120vw,var(--butterfly-y3),0) rotate(8deg);
        opacity:0;
    }
}

@keyframes butterflyFlutter{
    from{ transform:scaleX(.65) rotate(-5deg); }
    to{ transform:scaleX(1.12) rotate(5deg); }
}

/*=========================
FIREFLIES
=========================*/

.firefly{
    position:absolute;
    width:var(--firefly-size);
    height:var(--firefly-size);
    border-radius:50%;
    background:rgba(255,245,130,.95);
    box-shadow:
        0 0 7px rgba(255,245,120,.95),
        0 0 18px rgba(220,255,90,.8),
        0 0 32px rgba(180,255,70,.45);
    animation:
        fireflyWander var(--firefly-speed) ease-in-out infinite alternate,
        fireflyGlow var(--firefly-glow) ease-in-out infinite;
    will-change:transform,opacity;
}

@keyframes fireflyWander{
    0%{ transform:translate3d(0,0,0); }
    33%{ transform:translate3d(var(--firefly-x1),var(--firefly-y1),0); }
    66%{ transform:translate3d(var(--firefly-x2),var(--firefly-y2),0); }
    100%{ transform:translate3d(var(--firefly-x3),var(--firefly-y3),0); }
}

@keyframes fireflyGlow{
    0%,100%{ opacity:.08; transform:scale(.65); }
    45%{ opacity:1; transform:scale(1.35); }
    70%{ opacity:.25; transform:scale(.85); }
}

</style>

</head>

<body>

<img id="background" src="daisy-pi-background.jpg">

<div id="flowerLayer" class="effectLayer"></div>
<div id="sparkleLayer" class="effectLayer"></div>
<div id="dustLayer" class="effectLayer"></div>
<div id="rainLayer" class="effectLayer"></div>
<div id="snowLayer" class="effectLayer"></div>
<div id="leafLayer" class="effectLayer"></div>
<div id="butterflyLayer" class="effectLayer"></div>
<div id="fireflyLayer" class="effectLayer"></div>



<script>

/*==================================================
CONFIG
==================================================*/

const CONFIG={

background:"daisy-pi-background.jpg",

effects:{

flowers:true,

sparkles:true,

dust:false,

rain:false,

snow:false,

leaves:false,

butterflies:false,

fireflies:true

}

};

/*==================================================
BACKGROUND
==================================================*/

document.getElementById("background").src=CONFIG.background;



/*==================================================
RANDOM HELPERS
==================================================*/

function rand(min,max){

return Math.random()*(max-min)+min;

}

function randInt(min,max){

return Math.floor(rand(min,max+1));

}

function make(type,parent){

const e=document.createElement(type);

parent.appendChild(e);

return e;

}

/*==================================================
PLACEHOLDER FUNCTIONS
==================================================*/

/*==================================================
FLOWERS
==================================================*/

function createFlowers(){

    const layer=document.getElementById("flowerLayer");

    const flowerSymbols=[
        "🌸",
        "🌺",
        "🌼",
        "🌷"
    ];

    const amount=12;

    for(let i=0;i<amount;i++){

        const flower=make("div",layer);
        flower.className="flower";

        const inner=make("span",flower);
        inner.className="flowerInner";

        inner.textContent=
            flowerSymbols[
                randInt(0,flowerSymbols.length-1)
            ];

        const size=rand(18,42);
        const duration=rand(10,21);
        const delay=rand(-20,0);

        flower.style.left=rand(-5,100)+"vw";
        flower.style.fontSize=size+"px";

        flower.style.animationDuration=
            duration+"s";

        flower.style.animationDelay=
            delay+"s";

        flower.style.setProperty(
            "--drift",
            rand(-12,12)+"vw"
        );

        flower.style.setProperty(
            "--drift-end",
            rand(-22,22)+"vw"
        );

        inner.style.animationDuration=
            rand(5,12)+"s";

        inner.style.animationDelay=
            rand(-10,0)+"s";

        inner.style.setProperty(
            "--rotation",
            randInt(1,3)*360+"deg"
        );

        flower.style.opacity=
            rand(.55,1);

    }

}


/*==================================================
SPARKLES
==================================================*/

function createSparkles(){

    const layer=
        document.getElementById("sparkleLayer");

    const amount=38;

    for(let i=0;i<amount;i++){

        const sparkle=make("div",layer);
        sparkle.className="sparkle";

        const size=rand(2,7);

        sparkle.style.width=size+"px";
        sparkle.style.height=size+"px";

        sparkle.style.left=rand(2,98)+"vw";
        sparkle.style.top=rand(4,96)+"vh";

        sparkle.style.animationDuration=
            rand(1.8,4.5)+"s";

        sparkle.style.animationDelay=
            rand(-5,0)+"s";

    }

}


/*==================================================
FLOATING DUST
==================================================*/

function createDust(){

    const layer=
        document.getElementById("dustLayer");

    const amount=55;

    for(let i=0;i<amount;i++){

        const dust=make("div",layer);
        dust.className="dust";

        const size=rand(1,5);

        dust.style.width=size+"px";
        dust.style.height=size+"px";

        dust.style.left=rand(0,100)+"vw";
        dust.style.top=rand(25,115)+"vh";

        dust.style.animationDuration=
            rand(12,28)+"s";

        dust.style.animationDelay=
            rand(-30,0)+"s";

        dust.style.setProperty(
            "--dust-x",
            rand(-8,8)+"vw"
        );

        dust.style.setProperty(
            "--dust-x-end",
            rand(-16,16)+"vw"
        );

    }

}
function createRain(){

    const layer=document.getElementById("rainLayer");
    const amount=150;

    for(let i=0;i<amount;i++){

        const drop=make("div",layer);
        drop.className="rainDrop";

        drop.style.left=rand(-8,105)+"vw";
        drop.style.animationDuration=rand(.55,1.15)+"s";
        drop.style.animationDelay=rand(-2,0)+"s";

        drop.style.setProperty("--rain-length",rand(12,28)+"vh");
        drop.style.setProperty("--rain-angle",rand(-8,-3)+"deg");
        drop.style.setProperty("--rain-drift",rand(-10,-3)+"vw");
        drop.style.setProperty("--rain-opacity",rand(.3,.78));
    }
}

function createSnow(){

    const layer=document.getElementById("snowLayer");
    const symbols=["❄","❅","❆","•"];
    const amount=70;

    for(let i=0;i<amount;i++){

        const flake=make("div",layer);
        flake.className="snowFlake";
        flake.textContent=symbols[randInt(0,symbols.length-1)];

        flake.style.left=rand(-4,100)+"vw";
        flake.style.fontSize=rand(8,25)+"px";
        flake.style.animationDuration=rand(8,20)+"s";
        flake.style.animationDelay=rand(-20,0)+"s";

        flake.style.setProperty("--snow-mid",rand(-8,10)+"vw");
        flake.style.setProperty("--snow-end",rand(-16,18)+"vw");
        flake.style.setProperty("--snow-opacity",rand(.45,.95));
    }
}

function createLeaves(){

    const layer=document.getElementById("leafLayer");
    const symbols=["🍂","🍁","🍃","🌿"];
    const amount=34;

    for(let i=0;i<amount;i++){

        const leaf=make("div",layer);
        leaf.className="leaf";
        leaf.textContent=symbols[randInt(0,symbols.length-1)];

        leaf.style.left=rand(-8,100)+"vw";
        leaf.style.fontSize=rand(17,39)+"px";
        leaf.style.animationDuration=rand(9,20)+"s";
        leaf.style.animationDelay=rand(-20,0)+"s";

        leaf.style.setProperty("--leaf-x1",rand(-14,14)+"vw");
        leaf.style.setProperty("--leaf-x2",rand(-20,20)+"vw");
        leaf.style.setProperty("--leaf-x3",rand(-28,28)+"vw");
        leaf.style.setProperty("--leaf-opacity",rand(.55,.98));
    }
}

function createButterflies(){

    const layer=document.getElementById("butterflyLayer");
    const symbols=["🦋","🦋","🦋"];
    const amount=10;

    for(let i=0;i<amount;i++){

        const butterfly=make("div",layer);
        butterfly.className="butterfly";

        const inner=make("span",butterfly);
        inner.className="butterflyInner";
        inner.textContent=symbols[randInt(0,symbols.length-1)];

        butterfly.style.top=rand(4,78)+"vh";
        butterfly.style.fontSize=rand(22,45)+"px";
        butterfly.style.animationDuration=rand(13,28)+"s";
        butterfly.style.animationDelay=rand(-28,0)+"s";

        butterfly.style.setProperty("--butterfly-y0",rand(-8,8)+"vh");
        butterfly.style.setProperty("--butterfly-y1",rand(-18,18)+"vh");
        butterfly.style.setProperty("--butterfly-y2",rand(-22,22)+"vh");
        butterfly.style.setProperty("--butterfly-y3",rand(-16,16)+"vh");
        butterfly.style.setProperty("--butterfly-opacity",rand(.6,1));

        inner.style.animationDuration=rand(.22,.48)+"s";
        inner.style.animationDelay=rand(-1,0)+"s";
    }
}

function createFireflies(){

    const layer=document.getElementById("fireflyLayer");
    const amount=38;

    for(let i=0;i<amount;i++){

        const firefly=make("div",layer);
        firefly.className="firefly";

        firefly.style.left=rand(4,96)+"vw";
        firefly.style.top=rand(18,94)+"vh";
        firefly.style.animationDelay=rand(-12,0)+"s,"+rand(-5,0)+"s";

        firefly.style.setProperty("--firefly-size",rand(2,5.5)+"px");
        firefly.style.setProperty("--firefly-speed",rand(5,13)+"s");
        firefly.style.setProperty("--firefly-glow",rand(1.5,4.5)+"s");
        firefly.style.setProperty("--firefly-x1",rand(-6,6)+"vw");
        firefly.style.setProperty("--firefly-y1",rand(-7,7)+"vh");
        firefly.style.setProperty("--firefly-x2",rand(-10,10)+"vw");
        firefly.style.setProperty("--firefly-y2",rand(-10,10)+"vh");
        firefly.style.setProperty("--firefly-x3",rand(-7,7)+"vw");
        firefly.style.setProperty("--firefly-y3",rand(-8,8)+"vh");
    }
}

/*==================================================
START ENGINE
==================================================*/

if(CONFIG.effects.flowers)
createFlowers();

if(CONFIG.effects.sparkles)
createSparkles();

if(CONFIG.effects.dust)
createDust();

if(CONFIG.effects.rain)
createRain();

if(CONFIG.effects.snow)
createSnow();

if(CONFIG.effects.leaves)
createLeaves();

if(CONFIG.effects.butterflies)
createButterflies();

if(CONFIG.effects.fireflies)
createFireflies();

</script>

</body>
</html>
