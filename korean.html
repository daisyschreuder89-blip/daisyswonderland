<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Study</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3e8dc;
            font-family: Georgia, serif;
            color: #49372e;
        }

        .korean-cabinet {
            width: min(520px, 85%);
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .study-drawer {
            position: relative;
            height: 85px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c99f7b;
            border: 2px solid #8f684c;
            border-radius: 5px;

            box-shadow:
                inset 0 4px 5px rgba(255, 255, 255, 0.25),
                inset 0 -5px 7px rgba(80, 45, 25, 0.18),
                0 5px 8px rgba(70, 45, 30, 0.2);

            font-size: 18px;
            letter-spacing: 1px;
        }

        .drawer-handle {
            position: absolute;
            bottom: 10px;

            width: 46px;
            height: 14px;

            border: 4px solid #76523d;
            border-top: 0;
            border-radius: 0 0 18px 18px;

            background: transparent;
        }

        .drawer-label {
            transform: translateY(-10px);
        }

        .study-drawer {
            cursor: pointer;
            transition: transform 0.25s ease;
            z-index: 2;
        }
        .study-drawer + .study-drawer {
    margin-top: 10px;
}
.drawer-cabinet {
    padding: 12px;

    background: #a97c5b;
    border: 4px solid #76523d;
    border-radius: 7px;

    box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.10),
        0 6px 10px rgba(70, 45, 30, 0.20);
}
.study-drawer:hover {
    transform: translateY(-2px);

    box-shadow:
        inset 0 4px 5px rgba(255, 255, 255, 0.25),
        inset 0 -5px 7px rgba(80, 45, 25, 0.18),
        0 8px 12px rgba(70, 45, 30, 0.30);
}
        


        /* ===== PHOTO DRAWERS ===== */
        .photo-album {
            display: none;
            position: relative;
            margin: 0 8px 10px;
            padding: 20px 16px 18px;
            overflow-x: auto;
            overflow-y: hidden;
            background: #8f684c;
            border: 2px solid #76523d;
            border-top: 0;
            box-shadow: inset 0 8px 12px rgba(60, 35, 20, 0.18);
            scrollbar-width: thin;
        }

        .photo-album.open {
            display: block;
        }

        .photo-strip {
            display: flex;
            align-items: center;
            gap: 0;
            width: max-content;
            min-height: 170px;
            padding: 10px 18px 16px 10px;
        }

        .photo-strip img {
            display: block;
            width: auto;
            max-width: 230px;
            height: auto;
            max-height: 155px;
            object-fit: contain;
            margin-right: -10px;
            padding: 6px;
            background: #fffaf2;
            border: 1px solid rgba(90, 65, 45, 0.22);
            box-shadow: 0 5px 10px rgba(55, 35, 25, 0.28);
            cursor: zoom-in;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .photo-strip img:nth-child(4n + 1) { transform: rotate(-3deg) translateY(5px); }
        .photo-strip img:nth-child(4n + 2) { transform: rotate(2deg) translateY(-5px); }
        .photo-strip img:nth-child(4n + 3) { transform: rotate(-1deg) translateY(8px); }
        .photo-strip img:nth-child(4n)     { transform: rotate(3deg) translateY(-2px); }

        .photo-strip img:hover {
            position: relative;
            z-index: 5;
            transform: rotate(0deg) translateY(-5px) scale(1.04);
            box-shadow: 0 9px 18px rgba(55, 35, 25, 0.35);
        }

        /* Full-size photo viewer */
        .photo-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(35, 25, 20, 0.86);
        }

        .photo-lightbox.open {
            display: block;
        }

        .lightbox-toolbar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 103;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 250, 242, 0.94);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .lightbox-toolbar button,
        .lightbox-arrow,
        .photo-lightbox-close {
            border: 0;
            cursor: pointer;
        }

        .lightbox-toolbar button {
            min-width: 34px;
            height: 32px;
            border-radius: 16px;
            background: #e6c7aa;
            color: #49372e;
            font-size: 18px;
        }

        #zoom-label {
            min-width: 52px;
            text-align: center;
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #49372e;
        }

        #photo-count {
            padding-left: 6px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #49372e;
        }

        .lightbox-viewport {
            position: absolute;
            inset: 64px 68px 28px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overscroll-behavior: contain;
        }

        .lightbox-viewport.zoomed {
            align-items: flex-start;
            justify-content: flex-start;
        }

        .photo-lightbox img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            flex: 0 0 auto;
            background: white;
            padding: 8px;
            box-sizing: border-box;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            z-index: 103;
            width: 46px;
            height: 62px;
            margin-top: -31px;
            border-radius: 8px;
            background: rgba(255, 250, 242, 0.88);
            color: #49372e;
            font-size: 34px;
            line-height: 1;
        }

        .lightbox-prev { left: 12px; }
        .lightbox-next { right: 12px; }

        .photo-lightbox-close {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 104;
            background: transparent;
            color: white;
            font: 36px/1 Arial, sans-serif;
        }

        @media (max-width: 600px) {
            .lightbox-viewport { inset: 64px 48px 20px; }
            .lightbox-arrow { width: 38px; }
            .lightbox-prev { left: 5px; }
            .lightbox-next { right: 5px; }
        }


    </style>
</head>

<body>

    <div class="korean-cabinet">

    <h1>한국어 · Korean</h1>

    <div class="drawer-cabinet">

        <div class="study-drawer" onclick="window.location.href='hangul.html'">
    <span class="drawer-label">한글 · HANGUL</span>
    <div class="drawer-handle"></div>
</div>

<!-- ===== DRAWER 2: PRONUNCIATION PHOTO ALBUM ===== -->

</div>

<div class="photo-album" id="pronunciation-album">

    </div>
</div>

<!-- ===== DRAWER 3: GRAMMAR PHOTO ALBUM ===== -->
<div class="study-drawer photo-drawer" data-album="grammar-album">
    <span class="drawer-label">설명 · 语法</span>
    <div class="drawer-handle"></div>
</div>

<div class="photo-album" id="grammar-album">
    <div class="photo-strip">
        <!-- ADD GRAMMAR PHOTOS HERE -->
        <!-- Example: <img src="images/grammar-1.jpg" alt="Grammar note"> -->
        <!-- Example: <img src="images/grammar-2.jpg" alt="Grammar note"> -->

    </div>
</div>

<div class="study-drawer"onclick="window.location.href='korean-m2.html'">
    <span class="drawer-label">MODULE 2 · FLASHCARDS</span>
    <div class="drawer-handle"></div>
</div>




   





    <!-- Enlarged photo viewer -->
    <div class="photo-lightbox" id="photo-lightbox" aria-hidden="true">
        <button class="photo-lightbox-close" type="button" aria-label="Close">×</button>

        <div class="lightbox-toolbar">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="zoom-reset" type="button">Fit</button>
            <span id="photo-count"></span>
        </div>

        <button class="lightbox-arrow lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photo">‹</button>

        <div class="lightbox-viewport" id="lightbox-viewport">
            <img id="lightbox-image" src="" alt="Enlarged study image">
        </div>

        <button class="lightbox-arrow lightbox-next" id="lightbox-next" type="button" aria-label="Next photo">›</button>
    </div>

    <script>
        // Open / close the two photo drawers.
        document.querySelectorAll('.photo-drawer').forEach(drawer => {
            drawer.addEventListener('click', () => {
                const album = document.getElementById(drawer.dataset.album);
                album.classList.toggle('open');
            });
        });

        // Make a normal mouse wheel move an open album sideways.
        document.querySelectorAll('.photo-album').forEach(album => {
            album.addEventListener('wheel', event => {
                if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
                    event.preventDefault();
                    album.scrollLeft += event.deltaY;
                }
            }, { passive: false });
        });

        const lightbox = document.getElementById('photo-lightbox');
        const viewport = document.getElementById('lightbox-viewport');
        const lightboxImage = document.getElementById('lightbox-image');
        const zoomLabel = document.getElementById('zoom-label');
        const photoCount = document.getElementById('photo-count');

        let activePhotos = [];
        let activeIndex = 0;
        let zoom = 1;
        let fitWidth = 0;
        let fitHeight = 0;

        function photosInSameDrawer(photo) {
            return [...photo.closest('.photo-strip').querySelectorAll('img')];
        }

        function openPhoto(photo) {
            activePhotos = photosInSameDrawer(photo);
            activeIndex = activePhotos.indexOf(photo);
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            showActivePhoto();
        }

        function showActivePhoto() {
            const photo = activePhotos[activeIndex];
            if (!photo) return;

            zoom = 1;
            lightboxImage.style.width = '';
            lightboxImage.style.height = '';
            lightboxImage.style.maxWidth = '100%';
            lightboxImage.style.maxHeight = '100%';
            viewport.classList.remove('zoomed');
            viewport.scrollTop = 0;
            viewport.scrollLeft = 0;

            lightboxImage.onload = () => {
                // Save the nice "fit to screen" size as our 100% starting point.
                fitWidth = lightboxImage.getBoundingClientRect().width;
                fitHeight = lightboxImage.getBoundingClientRect().height;
                updateZoomLabel();
            };

            lightboxImage.src = photo.src;
            lightboxImage.alt = photo.alt || 'Study image';
            photoCount.textContent = `${activeIndex + 1} / ${activePhotos.length}`;
        }

        function updateZoomLabel() {
            zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
        }

        function setZoom(newZoom) {
            if (!fitWidth || !fitHeight) return;
            zoom = Math.min(4, Math.max(1, newZoom));

            if (zoom === 1) {
                lightboxImage.style.width = '';
                lightboxImage.style.height = '';
                lightboxImage.style.maxWidth = '100%';
                lightboxImage.style.maxHeight = '100%';
                viewport.classList.remove('zoomed');
                viewport.scrollTop = 0;
                viewport.scrollLeft = 0;
            } else {
                lightboxImage.style.maxWidth = 'none';
                lightboxImage.style.maxHeight = 'none';
                lightboxImage.style.width = `${fitWidth * zoom}px`;
                lightboxImage.style.height = `${fitHeight * zoom}px`;
                viewport.classList.add('zoomed');
            }
            updateZoomLabel();
        }

        function changePhoto(step) {
            if (!activePhotos.length) return;
            activeIndex = (activeIndex + step + activePhotos.length) % activePhotos.length;
            showActivePhoto();
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            lightboxImage.src = '';
            activePhotos = [];
            fitWidth = 0;
            fitHeight = 0;
        }

        // Event delegation means photos you add later work automatically.
        document.querySelectorAll('.photo-strip').forEach(strip => {
            strip.addEventListener('click', event => {
                if (event.target.tagName === 'IMG') openPhoto(event.target);
            });
        });

        document.getElementById('lightbox-prev').addEventListener('click', event => {
            event.stopPropagation();
            changePhoto(-1);
        });

        document.getElementById('lightbox-next').addEventListener('click', event => {
            event.stopPropagation();
            changePhoto(1);
        });

        document.getElementById('zoom-in').addEventListener('click', event => {
            event.stopPropagation();
            setZoom(zoom + 0.5);
        });

        document.getElementById('zoom-out').addEventListener('click', event => {
            event.stopPropagation();
            setZoom(zoom - 0.5);
        });

        document.getElementById('zoom-reset').addEventListener('click', event => {
            event.stopPropagation();
            setZoom(1);
        });

        document.querySelector('.photo-lightbox-close').addEventListener('click', event => {
            event.stopPropagation();
            closeLightbox();
        });

        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', event => {
            if (!lightbox.classList.contains('open')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') changePhoto(-1);
            if (event.key === 'ArrowRight') changePhoto(1);
            if (event.key === '+' || event.key === '=') setZoom(zoom + 0.5);
            if (event.key === '-') setZoom(zoom - 0.5);
        });
    </script>

</body>

</html>
