<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Study</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3e8dc;
            font-family: Georgia, serif;
            color: #49372e;
        }

        .korean-cabinet {
            width: min(520px, 85%);
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .study-drawer {
            position: relative;
            height: 85px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c99f7b;
            border: 2px solid #8f684c;
            border-radius: 5px;

            box-shadow:
                inset 0 4px 5px rgba(255, 255, 255, 0.25),
                inset 0 -5px 7px rgba(80, 45, 25, 0.18),
                0 5px 8px rgba(70, 45, 30, 0.2);

            font-size: 18px;
            letter-spacing: 1px;
        }

        .drawer-handle {
            position: absolute;
            bottom: 10px;

            width: 46px;
            height: 14px;

            border: 4px solid #76523d;
            border-top: 0;
            border-radius: 0 0 18px 18px;

            background: transparent;
        }

        .drawer-label {
            transform: translateY(-10px);
        }

        .study-drawer {
            cursor: pointer;
            transition: transform 0.25s ease;
            z-index: 2;
        }
        .study-drawer + .study-drawer {
    margin-top: 10px;
}
.drawer-cabinet {
    padding: 12px;

    background: #a97c5b;
    border: 4px solid #76523d;
    border-radius: 7px;

    box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.10),
        0 6px 10px rgba(70, 45, 30, 0.20);
}
.study-drawer:hover {
    transform: translateY(-2px);

    box-shadow:
        inset 0 4px 5px rgba(255, 255, 255, 0.25),
        inset 0 -5px 7px rgba(80, 45, 25, 0.18),
        0 8px 12px rgba(70, 45, 30, 0.30);
}
        
    </style>
</head>

<body>

    <div class="korean-cabinet">

    <h1>한국어 · Korean</h1>

    <div class="drawer-cabinet">

        <div class="study-drawer" onclick="window.location.href='hangul.html'">
    <span class="drawer-label">한글 · HANGUL</span>
    <div class="drawer-handle"></div>
</div>

<div class="study-drawer">
    <span class="drawer-label">MODULE 2 · FLASHCARDS</span>
    <div class="drawer-handle"></div>
</div>

<div class="study-drawer">
    <span class="drawer-label">SOUND CHANGES · 음운 변화</span>
    <div class="drawer-handle"></div>
</div>

    </div>

</div>

   



</body>

</html>
