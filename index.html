<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daisy's Wonderland</title>

    <style>
        * {
            box-sizing: border-box;

        }

        body {
            margin: 0;
            background: #07111c;
        }

        @keyframes hotspot-breathe {

            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 1;
            }
        }

        .mini-window {
            display: none;

            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 70vw;
            height: 88vh;

            background: white;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;

            overflow: hidden;
            z-index: 1000;

            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        .mini-window.open {
            display: flex;
            flex-direction: column;
        }

        .mini-window-bar {
            height: 36px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 12px;

            background: rgba(30, 40, 70, 0.95);
            color: white;

            font-family: Georgia, serif;
        }

        .mini-window-close {
            border: 0;
            background: transparent;
            color: white;

            font-size: 22px;
            cursor: pointer;
        }

        .mini-window iframe {
            width: 100%;
            flex: 1;

            border: 0;
        }



        /* The picture and all future hotspots live inside this container. */
        .wonderland {
            position: relative;
            width: 100%;
            max-width: 1049px;
            margin: 0 auto;
        }

        .wonderland-image {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Invisible clickable area placed over the moon. */
        .moon-hotspot {
            position: absolute;
            left: 81%;
            top: 5.78%;
            width: 5.3%;
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            text-decoration: none;
            background: transparent;
            border: 0;
            padding: 0;
        }

        /* The glowing cue appears only when hovered or keyboard-focused. */
        .moon-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(255, 235, 175, 0.35);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }

        .moon-hotspot:hover::before,
        .moon-hotspot:focus-visible::before {
            background: rgba(255, 235, 175, 0.4);
            opacity: 1;
        }


        .moon-hotspot::after {
            content: "Open to see moon journey";
            position: absolute;
            left: 50%;
            bottom: -42px;
            transform: translateX(-50%) translateY(5px);
            padding: 7px 10px;
            border: 1px solid rgba(255, 204, 125, 0.75);
            border-radius: 999px;
            background: rgba(5, 16, 28, 0.94);
            color: #ffd99a;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        .moon-hotspot:hover::after,
        .moon-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .moon-hotspot:focus-visible {
            outline: 3px solid #fff2c8;
            outline-offset: 5px;
        }

        /* =========================================
   TELESCOPE HOTSPOT
   ========================================= */

        /* Invisible clickable area over the telescope */
        .telescope-hotspot {
            position: absolute;

            /* Adjust these four to fit the telescope */
            left: 53%;
            top: 12%;
            width: 8%;
            height: 9%;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
        }


        /* Soft blurry light */
        .telescope-hotspot::before {
            content: "";
            position: absolute;
            inset: 20%;

            background: rgba(120, 200, 255, 0.4);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        /* Light appears when hovered */
        .telescope-hotspot:hover::before,
        .telescope-hotspot:focus-visible::before {
            background: rgba(190, 225, 255, 0.4);
            opacity: 1;
        }


        /* Tooltip */
        .telescope-hotspot::after {
            content: "Check out the stars tonight";
            position: absolute;
            left: 50%;
            bottom: 110%;
            transform: translateX(-50%) translateY(5px);

            padding: 7px 10px;
            border: 1px solid rgba(180, 220, 255, 0.75);
            border-radius: 999px;
            background: rgba(5, 16, 28, 0.94);
            color: #d9efff;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        /* Tooltip appears when hovered */
        .telescope-hotspot:hover::after,
        .telescope-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* =========================================
   WINDOW HOTSPOT
   ========================================= */

        /* Invisible clickable area over the WINDOW */
        .window-hotspot {
            position: absolute;

            /* Adjust these four to fit  */
            left: 45.5%;
            top: 10%;
            width: 5.5%;
            height: 6%;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
        }


        /* Soft blurry light */
        .window-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(255, 140, 80, 0.35);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        /* Light appears when hovered */
        .window-hotspot:hover::before,
        .window-hotspot:focus-visible::before {
            background: rgba(190, 225, 255, 0.4);
            opacity: 1;
        }


        /* Tooltip */
        .window-hotspot::after {
            content: "How many hours left until the sun goes down?";
            position: absolute;
            left: 50%;
            bottom: 110%;
            transform: translateX(-50%) translateY(5px);

            padding: 7px 10px;
            border: 1px solid rgba(193, 78, 33, 0.75);
            border-radius: 999px;
            background: rgba(5, 16, 28, 0.94);
            color: #e4621c;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        /* Tooltip appears when hovered */
        .window-hotspot:hover::after,
        .window-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* =========================================
   weather HOTSPOT
   ========================================= */

        /* Invisible clickable area over the globe */
        .weather-hotspot {
            position: absolute;

            /* Adjust these four to fit the telescope */
            right: 4.5%;
            top: 9%;
            width: 3%;
            height: 3%;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
        }


        /* Soft blurry light */
        .weather-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgb(171, 63, 63);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        /* Light appears when hovered */
        .weather-hotspot:hover::before,
        .weather-hotspot:focus-visible::before {
            background: rgba(190, 225, 255, 0.4);
            opacity: 1;
        }


        /* Tooltip */
        .weather-hotspot::after {
            content: "Should I go outside?";
            position: absolute;
            left: 50%;
            bottom: 110%;
            transform: translateX(-50%) translateY(5px);

            padding: 7px 10px;
            border: 1px solid rgba(229, 238, 238, 0.75);
            border-radius: 999px;
            background: rgba(32, 30, 29, 0.94);
            color: #f0ebe9;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        /* Tooltip appears when hovered */
        .weather-hotspot:hover::after,
        .weather-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }



        /* =========================================
   GLOBE HOTSPOT
   ========================================= */

        /* Invisible clickable area over the globe */
        .globe-hotspot {
            position: absolute;

            /* Adjust these four to fit  */
            left: 44%;
            top: 31.5%;
            width: 4%;
            height: 3%;
            cursor: pointer;
            text-decoration: none;
            border: 0;
            background: transparent;
        }


        /* Soft blurry light */
        .globe-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(0, 255, 255, 0.3);
            filter: blur(5px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        /* Light appears when hovered */
        .globe-hotspot:hover::before,
        .globe-hotspot:focus-visible::before {
            background: rgba(190, 225, 255, 0.4);
            opacity: 1;
        }


        /* Tooltip */
        .globe-hotspot::after {
            content: "Is my mom awake in QingDao?";
            position: absolute;
            left: 50%;
            bottom: 110%;
            transform: translateX(-50%) translateY(5px);

            padding: 7px 10px;
            border: 1px solid rgba(180, 220, 255, 0.75);
            border-radius: 999px;
            background: rgba(5, 16, 28, 0.94);
            color: #d9efff;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        /* Tooltip appears when hovered */
        .globe-hotspot:hover::after,
        .globee-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* =========================================
   LOVEPIG HOTSPOT
   ========================================= */

        /* Invisible clickable area over the globe */
        .LOVEPIG-hotspot {
            position: absolute;

            /* Adjust these four to fit the telescope */
            left: 16%;
            top: 2%;
            width: 4%;
            height: 4%;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
        }


        /* Soft blurry light */
        .LOVEPIG-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;

            background: rgba(184, 58, 108, 0.5);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        /* Light appears when hovered */
        .LOVEPIG-hotspot:hover::before,
        .LOVEPIG-hotspot:focus-visible::before {
            background: rgba(190, 225, 255, 0.4);
            opacity: 1;
        }


        /* Tooltip */
        .LOVEPIG-hotspot::after {
            content: "How much love💖 today?";
            position: absolute;
            left: 50%;
            bottom: auto;
            top: 110%;
            transform: translateX(-50%) translateY(5px);

            padding: 7px 10px;
            border: 1px solid rgba(159, 32, 70, 0.75);
            border-radius: 999px;
            background: rgba(8, 8, 8, 0.94);
            color: #cf5267;
            font: 14px/1.2 Georgia, serif;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }


        /* Tooltip appears when hovered */
        .LOVEPIG-hotspot:hover::after,
        .LOVEPIG-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* =========================================
   catgallery HOTSPOT
   ========================================= */

        /* Invisible clickable area over the globe */
        .catgallery-hotspot {
            position: absolute;

            /* Adjust these four to fit the telescope */
            left: 38%;
            top: 27%;
            width: 5%;
            height: 3%;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
        }


        /* Soft blurry light */
        .catgallery-hotspot::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(206, 70, 149, 0.5);
            filter: blur(8px);
            mix-blend-mode: screen;

            opacity: 0;
            transition: background-color .2s ease, opacity .2s ease;
        }


        


        /* On small phones, make the invisible touch target a little easier to tap. */
        @media (max-width: 600px) {
            .moon-hotspot {
                left: 78.1%;
                top: 3.9%;
                width: 8%;
            }

            .moon-hotspot::after {
                bottom: -36px;
                font-size: 12px;
            }

            .breathing-hotspot::before {

                animation: hotspot-breathe 3.5s ease-in-out infinite;
            }

            .tv-hotspot.netflix-on {
                font-size: 4px !important;
            }
        }


        /* Invisible clickable area over the left porch cat. */
        .left-cat-hotspot {
            position: absolute;
            left: 41.5%;
            top: 82%;
            width: 6%;
            height: 8%;
            border: 0;
            padding: 0;
            border-radius: 48%;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Soft outline around the cat when someone discovers the hotspot. */
        .left-cat-hotspot::before {
            content: "";
            position: absolute;
            inset: -10%;
            border-radius: 48%;
            border: 2px solid rgba(255, 218, 169, 0);
            box-shadow: 0 0 0 rgba(255, 198, 135, 0);
            transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
        }

        /* Small hover label. */
        .left-cat-hotspot::after {
            content: "Pet me!";
            position: absolute;
            left: 41.5%;
            bottom: 108%;
            transform: translateX(-50%) translateY(5px);
            padding: 6px 9px;
            border: 1px solid rgba(255, 204, 145, 0.78);
            border-radius: 999px;
            background: rgba(5, 16, 28, 0.94);
            color: #ffe0ad;
            font: 13px/1.2 Georgia, serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }



        .left-cat-hotspot:hover::after,
        .left-cat-hotspot:focus-visible::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .left-cat-hotspot:focus-visible {
            outline: 3px solid #fff2c8;
            outline-offset: 4px;
        }

        /* Brief paw that pops upward after a click. */
        .paw-pop {
            position: absolute;
            left: 45%;
            top: 82%;
            font-size: clamp(16px, 2.2vw, 25px);
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, 0) scale(0.75) rotate(-12deg);
        }

        .paw-pop.show {
            animation: paw-float 700ms ease-out;
        }

        .fireplace-hotspot {
            position: absolute;
            right: 46%;
            top: 53%;
            width: 8%;
            height: 5%;

            border: 0;
            background: transparent;
            cursor: pointer;

        }

        .fireplace-hotspot.fire-on {
            background: radial-gradient(ellipse,
                    rgba(255, 180, 60, 0.8) 0%,
                    rgba(255, 90, 20, 0.45) 40%,
                    transparent 45%);
            filter: blur(6px);
        }

        .bathtub-hotspot {
            position: absolute;
            right: 29%;
            bottom: 45%;
            width: 6%;
            height: 3%;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .bath-bubble {
            position: absolute;
            border: 1px solid rgba(220, 245, 255, 0.9);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: inset 2px 2px 3px rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: 20;
        }

        .guitar-hotspot {
            position: absolute;
            right: 33.5%;
            bottom: 20%;
            width: 3%;
            height: 7%;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        .tv-hotspot {
            position: absolute;
            left: 76.35%;
            top: 33.5%;
            width: 5%;
            height: 3.2%;
            border: 0;
            background: transparent;
            cursor: pointer;
            color: transparent;
        }

        .tv-hotspot.netflix-on {
            background: black;
            color: #e50914;
            font-weight: bold;
            font-size: 10.5px;
        }


        .washer-hotspot {
            position: absolute;
            left: 76.3%;
            top: 55%;
            width: 1.8%;
            height: 1.25%;;

            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;

            background: transparent;
        }

        .washer-hotspot.washing {

            animation: washer-spin 1.2s linear infinite;
        }

        .washer-hotspot.washing,
        .washer-hotspot.stopped {
            background:
                radial-gradient(circle at 65% 35%,
                    rgba(230, 245, 255, 0.65) 0 18%,
                    transparent 20%),
                radial-gradient(circle at 35% 70%,
                    rgba(150, 190, 220, 0.45) 0 22%,
                    transparent 24%);
        }

        .washer-hotspot.washing {
            animation: washer-spin 1.2s linear infinite;
        }

        .shooting-star {
            position: absolute;
            left: 75%;
            top: 10%;

            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 6px white;

            z-index: 20;
            opacity: 0;
        }

        .shooting-star::after {
            content: "";
            position: absolute;

            width: 35px;
            height: 1px;

            left: 2px;
            top: 1px;

            background: linear-gradient(to left,
                    white,
                    transparent);
            transform: rotate(-34deg);
            transform-origin: left center;
        }

        .computer-hotspot {
            position: absolute;
            right: 26.6%;
            bottom: 29%;
            width: 2.9%;
            height: 1%;

            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .computer-hotspot.computer-on {
            background: rgba(210, 245, 255, 0.35);
            box-shadow: 0 0 4px 1px rgba(170, 230, 255, 0.65);
        }

        .chimney-smoke {
            position: absolute;

            right: 38%;
            top: 3%;

            width: 18px;
            height: 18px;

            background: rgba(210, 215, 220, 0.45);
            border-radius: 50%;
            filter: blur(3px);
            animation: chimney-rise 3s ease-out infinite;
        }


        @keyframes chimney-rise {
            0% {
                transform: translate(0, 0) scale(0.7);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translate(12px, -45px) scale(1.8);
                opacity: 0;
            }
        }

        @keyframes paw-float {
            0% {
                opacity: 0;
                transform: translate(-50%, 8px) scale(0.65) rotate(-12deg);
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -28px) scale(1.15) rotate(8deg);
            }
        }

        @keyframes washer-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .left-cat-hotspot.cooldown {
            cursor: default;
        }

        @keyframes shoot {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-120px, 80px);
            }
        }

        .daisy-hotspot {
            position: absolute;
            left: 2%;
            top: 2.5%;
            width: 11%;
            height: 4%;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            z-index: 10;

        }

        @media (prefers-reduced-motion: reduce) {
            .paw-pop.show {
                animation: none;
            }
        }

        .window-rain {
            position: absolute;

            right: 23%;
            top: 27%;
            width: 21.93%;
            height: 7.63%;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            overflow: hidden;

        }

        .raindrop {
            position: absolute;
            left: 50%;
            top: 10%;
            width: 1px;
            height: clamp(6px, 1.72vw, 18px);
            background: rgba(210, 235, 255, 0.8);
            transform: rotate(10deg);
            animation: rain-fall 0.8s linear infinite;
        }

        @keyframes rain-fall {
            from {
                top: -15px;
                transform: translateX(0) rotate(10deg);
            }

            to {
                top: 100%;
                transform: translateX(-25px) rotate(10deg);
            }
        }

        .raindrop:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .raindrop:nth-child(2) {
            left: 28%;
            animation-delay: -0.3s;
        }

        .raindrop:nth-child(3) {
            left: 45%;
            animation-delay: -0.6s;
        }

        .raindrop:nth-child(4) {
            left: 62%;
            animation-delay: -0.15s;
        }

        .raindrop:nth-child(5) {
            left: 78%;
            animation-delay: -0.5s;
        }

        .raindrop:nth-child(6) {
            left: 95%;
            animation-delay: -0.75s;
        }

        .window-rain.rain-off .raindrop {
            display: none;
        }

        .cat-eye {
            position: absolute;

            width: 5px;
            height: 5px;

            background: #151514;
            border-radius: 50%;

            z-index: 30;
            pointer-events: none;

            opacity: 1;
            animation: cat-wink 3s infinite;
        }

        .eye-left {
            left: 51.4%;
            bottom: 15.4%;
        }

        .eye-right {
            left: 50.3%;
            bottom: 15.4%;

        }



        @keyframes cat-wink {

            0%,
            88%,
            100% {
                opacity: 0;
            }

            90%,
            94% {
                opacity: 1;
            }
        }

        .korean-hotspot {
            position: absolute;

            left: 43%;
            bottom: 22%;
            width: 38px;
            height: 45px;

            background: transparent;
            border: 0;

            z-index: 30;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="wonderland">
        <img class="wonderland-image" src="wonderland.png" alt="Daisy's Wonderland illustrated house">

        <button class="moon-hotspot breathing-hotspot" type="button" aria-label="Open Moon"></button>
        <button class="telescope-hotspot breathing-hotspot" type="button" aria-label="Explore the sky"></button>
        <button class="window-hotspot breathing-hotspot" type="button" aria-label="Open sunset countdown"></button>
        <button class="globe-hotspot breathing-hotspot" type="button" aria-label="Open Qingdao time"></button>
        <button class="weather-hotspot breathing-hotspot" href="weather.html" aria-label="Should I go out?"></button>
        <button class="LOVEPIG-hotspot breathing-hotspot" type="button" aria-label="How much love💖 today?"></button>
        <button class="catgallery-hotspot breathing-hotspot" type="button" aria-label="check out cat photos"></button>
        <button class="left-cat-hotspot" type="button" aria-label="Make the left cat meow"></button>
        <button class="fireplace-hotspot" type="button" aria-label="Turn fireplace on"></button>
        <button class="bathtub-hotspot" type="button" aria-label="Make bathtub bubbles"></button>
        <button class="guitar-hotspot" type="button" aria-label="Strum the guitar"></button>
        <button class="tv-hotspot" type="button" aria-label="Turn on TV">NETFLIX</button>
        <button class="washer-hotspot" type="button" aria-label="Turn on washer"></button>
        <span class="shooting-star" aria-hidden="true"></span>
        <button class="computer-hotspot" type="button" aria-label="Start computer"></button>
        <button class="daisy-hotspot" type="button" aria-label="Open Daisy's Pi"></button>
        <button class="korean-hotspot" type="button" aria-label="Open Korean study"></button>

        <div class="cat-eye eye-left"></div>
        <div class="cat-eye eye-right"></div>



        <div class="chimney-smoke"></div>


        <div class="mini-window">
            <div class="mini-window-bar">
                <span class="mini-window-title"></span>
                <button class="mini-window-close" type="button" aria-label="Close window">×</button>
            </div>

            <iframe class="mini-window-frame" src="" title=""> </iframe>
        </div>


        <div class="window-rain rain-off">
            <span class="raindrop"></span>
            <span class="raindrop"></span>
            <span class="raindrop"></span>
            <span class="raindrop"></span>
            <span class="raindrop"></span>
            <span class="raindrop"></span>
        </div>

    </main>



    <audio id="cat-meow" preload="auto">
        <source src="meow.mp3" type="audio/mpeg">
    </audio>


    <audio id="xp-startup" preload="auto">
        <source src="winxp.mp3" type="audio/mpeg">
    </audio>

    <audio id="netflix-sound" preload="auto">
        <source src="netflix.mp3" type="audio/mpeg">
    </audio>

    <script>
        const moon = document.querySelector(".moon-hotspot");
        const telescope = document.querySelector(".telescope-hotspot");
        const globe = document.querySelector(".globe-hotspot");
        const sunsetWindow = document.querySelector(".window-hotspot");
        const lovePig = document.querySelector(".LOVEPIG-hotspot");
        const catGallery = document.querySelector(".catgallery-hotspot");
        const daisy = document.querySelector(".daisy-hotspot");
        const weather = document.querySelector(".weather-hotspot");
        const miniWindow = document.querySelector(".mini-window");
        const miniWindowClose = document.querySelector(".mini-window-close");
        const miniWindowFrame = document.querySelector(".mini-window-frame");
        const miniWindowTitle = document.querySelector(".mini-window-title");


        function openMiniWindow(page, title) {
            miniWindowFrame.src = page;
            miniWindowFrame.title = title;
            miniWindowTitle.textContent = title;

            miniWindow.classList.add("open");
        }


        telescope.addEventListener("click", () => {
            openMiniWindow("sky.html", "Tonight's Sky");
        });

        moon.addEventListener("click", () => {
            openMiniWindow("moon.html", "Moon");
        });

        weather.addEventListener("click", () => {
            openMiniWindow("weather.html", "Should I Go Outside?");
        });

        daisy.addEventListener("click", () => {
            openMiniWindow("daisy-pi.html");
        });

        globe.addEventListener("click", () => {
            openMiniWindow("qingdao-time.html", "Qingdao Time");
        });

        sunsetWindow.addEventListener("click", () => {
            openMiniWindow("sunset-pc.html", "Sunset Journey");
        });

        lovePig.addEventListener("click", () => {
            openMiniWindow("lovepig-pc.html", "Love Pig");

        });

        miniWindowClose.addEventListener("click", () => {
            miniWindow.classList.remove("open");
        });

        catGallery.addEventListener("click", () => {
            openMiniWindow("cat-gallery.html", "Cat Gallery");
        });



        //*computer**//
        const computer = document.querySelector(".computer-hotspot");
        const xpStartup = document.querySelector("#xp-startup");

        computer.addEventListener("click", () => {
            if (computer.classList.contains("computer-on")) {
                computer.classList.remove("computer-on");
            } else {
                computer.classList.add("computer-on");

                xpStartup.currentTime = 0;
                xpStartup.play();
            }
        });


        //**shooting star**//
        const shootingStar = document.querySelector(".shooting-star");

        function launchShootingStar() {
            const delay = 2000 + Math.random() * 3000;

            setTimeout(() => {
                shootingStar.style.opacity = "1";
                shootingStar.style.animation = "shoot 1.2s linear";

                shootingStar.addEventListener("animationend", () => {
                    shootingStar.style.opacity = "0";
                    shootingStar.style.animation = "none";

                    launchShootingStar();
                }, { once: true });

            }, delay);
        }
        launchShootingStar();


        const tv = document.querySelector(".tv-hotspot");
        const netflixSound = document.querySelector("#netflix-sound");

        tv.addEventListener("click", () => {
            tv.classList.toggle("netflix-on");

            if (tv.classList.contains("netflix-on")) {
                netflixSound.currentTime = 0;
                netflixSound.play();
            }
        });


        //**washer**//
        const washer = document.querySelector(".washer-hotspot");
        washer.addEventListener("click", () => {
            if (washer.classList.contains("washing")) {
                washer.classList.remove("washing");
                washer.classList.add("stopped");
            } else {
                washer.classList.remove("stopped");
                washer.classList.add("washing");
            }
        });




        //**guitar**//
        const guitar = document.querySelector(".guitar-hotspot");
        const guitarNotes = [262, 294, 330, 349, 392, 440];
        let guitarNote = 0;

        guitar.addEventListener("click", () => {

            const audio = new AudioContext();
            const tone = audio.createOscillator();
            const volume = audio.createGain();

            tone.connect(volume);
            volume.connect(audio.destination);

            tone.frequency.value = guitarNotes[guitarNote];

            guitarNote++;

            if (guitarNote >= guitarNotes.length) {
                guitarNote = 0;
            }
            volume.gain.setValueAtTime(0.15, audio.currentTime);
            volume.gain.exponentialRampToValueAtTime(
                0.001,
                audio.currentTime + 0.7
            );

            tone.start();
            tone.stop(audio.currentTime + 0.7);

        });

        //**bathbubble**//
        const bathtub = document.querySelector(".bathtub-hotspot");

        bathtub.addEventListener("click", () => {

            for (let i = 0; i < 4; i++) {

                const bubble = document.createElement("span");
                bubble.className = "bath-bubble";
                const size = 2 + Math.random() * 5;

                bubble.style.width = size + "px";
                bubble.style.height = size + "px";

                bubble.style.left = Math.random() * 100 + "%";
                bubble.style.top = Math.random() * 100 + "%";

                bathtub.appendChild(bubble);
            }

        });


        const fireplace = document.querySelector(".fireplace-hotspot");

        fireplace.addEventListener("click", () => {
            fireplace.classList.toggle("fire-on");
        });

        const windowRain = document.querySelector(".window-rain");

        windowRain.addEventListener("click", () => {
            windowRain.classList.toggle("rain-off");
        });


        const wonderland = document.querySelector(".wonderland");
        const leftCat = document.querySelector(".left-cat-hotspot");
        const catMeow = document.querySelector("#cat-meow");



        leftCat.addEventListener("click", () => {
            // Create a brand-new paw every click.
            const pawPop = document.createElement("span");
            pawPop.className = "paw-pop";
            pawPop.textContent = "💓";
            pawPop.setAttribute("aria-hidden", "true");
            wonderland.appendChild(pawPop);

            // Animate this new paw directly with JavaScript.
            const pawAnimation = pawPop.animate(
                [
                    {
                        opacity: 0,
                        transform: "translate(-50%, 8px) scale(0.65) rotate(-12deg)"
                    },
                    {
                        opacity: 1,
                        offset: 0.25
                    },
                    {
                        opacity: 0,
                        transform: "translate(-50%, -28px) scale(1.15) rotate(8deg)"
                    }
                ],
                {
                    duration: 700,
                    easing: "ease-out"
                }
            );

            // Delete the paw when this individual animation ends.
            pawAnimation.finished
                .then(() => pawPop.remove())
                .catch(() => pawPop.remove());

            // Restart the meow from the beginning.
            catMeow.currentTime = 0;
            catMeow.play().catch((error) => {
                console.error(
                    "Could not play meow.mp3. Make sure it is in the same folder as this HTML file.",
                    error
                );
            });
        });

        const korean = document.querySelector(".korean-hotspot");

        korean.addEventListener("click", () => {
            openMiniWindow("korean.html", "Korean Study");
        });
    </script>

</body>

</html>
